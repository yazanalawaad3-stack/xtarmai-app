<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>تسجيل الدخول</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<main class="container">
  <div class="shell">
    <div class="brand">
      <a class="logo" href="login.html">
        <div class="badge">S</div>
        <div class="title">
          <strong>تسجيل الدخول</strong>
          <span>Phone + Password</span>
        </div>
      </a>
      <div class="chip">Mobile</div>
    </div>

    <section class="card">
      <div class="head">
        <h1 class="h1">تسجيل الدخول</h1>
        <p class="sub">اختر الدولة، أدخل رقم الهاتف وكلمة السر.</p>
      </div>
      <div class="body">

        <div class="field">
          <div class="label"><span>الدولة</span><span class="mini">نداء</span></div>
          <select id="country" aria-label="country"></select>
        </div>

        <div class="field">
          <div class="label"><span>رقم الهاتف</span><span class="mini">بدون +</span></div>
          <input id="phone" class="input" inputmode="tel" autocomplete="tel" placeholder="مثال: 03xxxxxx" />
        </div>

        <div class="field">
          <div class="label"><span>كلمة السر</span><span class="mini">Password</span></div>
          <input id="password" class="input" type="password" autocomplete="current-password" placeholder="********" />
        </div>

        <button id="login" class="btn">دخول</button>

        <div id="msg" class="alert" hidden></div>

        <div class="field" style="margin-top:14px">
          <div class="row">
            <div class="grow"><span class="mini">ما عندك حساب؟</span></div>
            <a class="mini" href="register.html">إنشاء حساب</a>
          </div>
        </div>

      </div>
    </section>

    <div class="footer">
      <span class="pill">✅ ستايل مناسب للجوال</span>
    </div>
  </div>
</main>

<script type="module" src="assets/login.js"></script>
</body>
</html>
