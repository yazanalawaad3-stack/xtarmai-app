<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>الرئيسية</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<main class="container">
  <div class="shell">
    <section class="card">
      <div class="head">
        <h1 class="h1">أهلاً 👋</h1>
        <p class="sub">تم تسجيل الدخول بنجاح. هذه صفحة اختبار.</p>
      </div>
      <div class="body">
        <button id="logout" class="btn secondary">تسجيل الخروج</button>
        <div id="msg" class="alert" hidden></div>
      </div>
    </section>

    <div class="footer">
      <span class="pill">بعدها نربط Dashboard مع profiles</span>
    </div>
  </div>
</main>

<script type="module">
  import { supabase, showAlert } from "./assets/supabaseClient.js";
  const btn = document.querySelector("#logout");
  const msg = document.querySelector("#msg");

  const { data } = await supabase.auth.getSession();
  if (!data?.session?.user) location.href="login.html";

  btn.addEventListener("click", async ()=>{
    await supabase.auth.signOut();
    showAlert(msg, "تم تسجيل الخروج.", "ok");
    setTimeout(()=> location.href="login.html", 500);
  });
</script>
</body>
</html>
