<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>USDT Demo Trading - Candles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<header>
  <h1>USDT Demo Trading (Educational)</h1>
  <p>Educational demo only. No real trading. No accounts. No database.</p>
</header>

<div class="container">
  <div class="chart-box">
    <div id="chart"></div>
  </div>

  <div class="panel">
    <h2>Demo Wallet</h2>
    <div class="row"><span>Balance</span><span id="balance">1000</span></div>
    <div class="row"><span>Pool</span><span id="pool">0</span></div>
    <div class="row"><span>Next Result</span><span id="next">LOSS</span></div>

    <input id="amount" type="number" value="100" min="1">
    <button id="tradeBtn">Place Demo Trade</button>
    <button id="resetBtn">Reset Demo</button>

    <ul class="rules">
      <li>Fixed sequence: LOSS, LOSS, WIN</li>
      <li>Loss: stake removed, 70% added to pool</li>
      <li>Win: 30% of pool paid, pool resets</li>
      <li>All logic is simulated</li>
    </ul>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
