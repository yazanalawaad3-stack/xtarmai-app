<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>الرئيسية</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="container">
    <div class="shell">
      <section class="card">
        <div class="head">
          <h1 class="h1">تم تسجيل الدخول ✅</h1>
          <p class="sub">هذه صفحة تجريبية. بعدين نستبدلها بواجهة مشروعك.</p>
        </div>
        <div class="body">
          <div id="who" class="hint" style="margin-bottom:10px"></div>
          <button id="logout" class="btn secondary">تسجيل الخروج</button>
          <div id="msg" class="alert" hidden></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { supabase, loadSession, clearSession, showAlert } from "./assets/supabaseClient.js";
    const btn = document.querySelector("#logout");
    const msg = document.querySelector("#msg");
    const who = document.querySelector("#who");

    const s = loadSession();
    if (!s?.token) location.href = "login.html";

    who.textContent = `مستخدم: ${s.public_id} — هاتف: ${s.phone}`;

    btn.addEventListener("click", async () => {
      try {
        // محاولة حذف الجلسة من قاعدة البيانات (قد تفشل إذا عندك RLS)
        await supabase.from("user_sessions").delete().eq("token", s.token);
      } catch {}
      clearSession();
      showAlert(msg, "تم تسجيل الخروج.", "ok");
      setTimeout(() => location.href = "login.html", 400);
    });
  </script>
</body>
</html>
